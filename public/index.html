<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ByaBot Control</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <section id="login-view" class="login-panel">
      <p class="eyebrow">BYABOT CONTROL</p>
      <h1>Controle privado do bot.</h1>
      <p class="muted">Entre para acessar os arquivos persistidos em <strong>/byabot</strong>.</p>
      <form id="login-form">
        <label for="password">Senha do painel</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="app-view" class="app-panel hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">BYABOT CONTROL</p>
          <h1>Arquivos do bot</h1>
        </div>
        <button id="logout" class="ghost" type="button">Sair</button>
      </header>
      <div class="workspace">
        <aside class="files-panel">
          <div class="section-title"><span>BYABOT</span><button id="refresh" class="icon-button" type="button" title="Atualizar arquivos">↻</button></div>
          <div id="file-list" class="file-list"></div>
        </aside>
        <section class="editor-panel">
          <div class="editor-head">
            <div><span id="file-name" class="file-name">Selecione um arquivo</span><span id="status" class="status"></span></div>
            <button id="save" type="button" disabled>Salvar</button>
          </div>
          <textarea id="editor" spellcheck="false" disabled placeholder="Selecione um arquivo para editar"></textarea>
        </section>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
